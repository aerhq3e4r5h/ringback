<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Link previews</title>
<!-- Source for og/home.png, og/pricing.png, og/trades.png and og/product.png (1200x630).
     Open og.html?v=home|pricing|trades|product and screenshot the 1200x630 frame; README "Pages" has the command.
     Only real claims and prices here: no ratings, counts or "trusted by". -->
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:500 800;font-stretch:75% 100%;src:url(../fonts/bricolage.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:400 600;src:url(../fonts/geist.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-weight:400 500;src:url(../fonts/geist-mono.woff2) format("woff2")}
:root{--bg:#07100F;--surface-1:#0B1716;--surface-3:#132423;--ink:#ECF3F0;--ink-2:#C5D3CE;--muted:#93A6A1;--line:rgba(214,240,232,.09);--line-2:rgba(214,240,232,.16);--ember:#FF7A3D;--red:#FF5A4E;--mint:#5BE3B4;--amber:#FFC857;--art-line:rgba(236,243,240,.55)}
*{box-sizing:border-box;margin:0}
html,body{background:#000}
.f{position:relative;width:1200px;height:630px;overflow:hidden;background:radial-gradient(70% 60% at 50% 115%,rgba(255,122,61,.16),transparent 70%),linear-gradient(var(--surface-1),var(--bg));color:var(--ink);font-family:"Geist",Arial,sans-serif;padding:64px 80px;display:grid;grid-template-rows:auto 1fr auto}
.f::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(90% 80% at 50% 40%,#000,transparent);opacity:.6}
.f::after{content:"";position:absolute;left:0;right:0;bottom:92px;height:1px;background:linear-gradient(90deg,transparent,var(--ember) 30%,var(--ember) 70%,transparent);opacity:.7}
.f > *{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:16px}
.mark{width:56px;height:56px}
.name{font-family:"Bricolage Grotesque";font-weight:700;font-size:34px;letter-spacing:-.02em}
.lbl{margin-left:auto;font:500 18px/1 "Geist Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mid{align-self:center;display:grid;gap:24px}
h1{font-family:"Bricolage Grotesque";font-weight:800;font-stretch:80%;font-size:104px;line-height:.95;letter-spacing:-.035em;max-width:1000px}
h1 .hot{color:var(--ember)}
.sub{font-size:32px;line-height:1.3;color:var(--ink-2)}
.sub b{color:var(--ink);font-weight:600}
.foot{display:flex;align-items:center;justify-content:space-between;font:500 20px/1 "Geist Mono",monospace;letter-spacing:.06em;color:var(--muted)}
.bars{display:flex;gap:7px;align-items:center;height:30px}.bars i{display:block;width:5px;border-radius:3px;background:var(--ember)}
.glyphs{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-top:6px}
.glyphs figure{display:grid;gap:10px;justify-items:center;padding:14px 6px 12px;border:1px solid var(--line-2);border-radius:18px;background:rgba(19,36,35,.6)}
.glyphs svg{width:120px;height:90px}
.glyphs figcaption{font:500 15px/1 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big-mark{position:absolute;right:0;top:50%;transform:translateY(-50%);width:190px;height:190px;z-index:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="f" id="frame">
  <div class="top">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#FF7A3D"/><path d="M8 13v6M12 10v12M16 7v18M20 10v12M24 13v6" stroke="#07100F" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span class="name">Ringback</span>
    <span class="lbl" id="lbl">AI receptionist for trades</span>
  </div>
  <div class="mid" id="mid"></div>
  <div class="foot"><span>ringback · Gauteng, South Africa</span><span class="bars" aria-hidden="true"><i style="height:10px"></i><i style="height:20px"></i><i style="height:30px"></i><i style="height:20px"></i><i style="height:10px"></i></span></div>
</div>
<script>
(function(){
  var v = new URLSearchParams(location.search).get('v') || 'home', mid = document.getElementById('mid'), lbl = document.getElementById('lbl');
  var T = [['plumbing','Plumbing'],['electrical','Electrical'],['gates','Gates'],['solar','Solar'],['pest','Pest'],['aircon','Aircon'],['locksmith','Locks']];
  var V = {
    home: { lbl: 'AI receptionist for trades', html: '<h1 style="max-width:720px;font-size:96px">Every call answered. <span class="hot">Every job booked.</span></h1>' +
      '<svg class="big-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#FF7A3D"/><path d="M8 13v6M12 10v12M16 7v18M20 10v12M24 13v6" stroke="#07100F" stroke-width="2.6" stroke-linecap="round"/></svg>' },
    pricing: { lbl: 'Pricing', html: '<h1>What are missed calls <span class="hot">costing you?</span></h1><p class="sub"><b>From R2,500/month</b> excl. VAT · free trial week</p>' },
    trades: { lbl: 'Built for your trade', html: '<h1 style="font-size:92px">Set up for <span class="hot">your trade</span></h1><div class="glyphs">' +
      T.map(function(t){ return '<figure><svg viewBox="0 0 160 120" aria-hidden="true"><use href="../art.svg#art-' + t[0] + '"/></svg><figcaption>' + t[1] + '</figcaption></figure>'; }).join('') + '</div>' },
    product: { lbl: 'How it works', html: '<h1 style="max-width:560px;font-size:96px">From missed call to <span class="hot" style="white-space:nowrap">booked job</span></h1><svg viewBox="0 0 520 260" style="position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:480px;height:240px" aria-hidden="true"><use href="../art.svg#art-callpath"/></svg>' }
  };
  var o = V[v] || V.home; lbl.textContent = o.lbl; mid.innerHTML = o.html; mid.style.position = 'relative';
  document.fonts.ready.then(function(){ document.body.setAttribute('data-ready', '1'); });
})();
</script>
</body>
</html>
