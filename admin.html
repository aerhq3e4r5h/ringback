<body data-page="admin" data-no-ai data-no-float>
<header id="site-header"></header>
<main class="app" style="grid-template-columns:1fr">
  <div class="pane" style="max-width:1300px;margin-inline:auto;width:100%">
    <div class="pane-head">
      <div style="display:grid;gap:10px"><span class="kicker">Owner only</span><h1>Admin</h1></div>
      <div class="ctas" style="margin-top:0"><a class="btn btn-line btn-sm" href="dashboard.html">My portal</a><button class="btn btn-line btn-sm" type="button" id="refreshBtn">Refresh</button></div>
    </div>
    <p class="alert err" id="noAccess" hidden>This page is only for the Ringback owner.</p>
    <div id="adminBody" hidden style="display:grid;gap:28px">
      <div class="kpis" id="adminKpis"></div>
      <section style="display:grid;gap:12px"><h2 style="font-size:1.6rem">Clients</h2><div id="clientsBox"></div></section>
      <section style="display:grid;gap:12px"><h2 style="font-size:1.6rem">Website enquiries</h2><div id="leadsBox"></div></section>
      <section style="display:grid;gap:12px"><h2 style="font-size:1.6rem">Account requests</h2><div id="reqBox"></div></section>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
